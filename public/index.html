<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella OS | Digital Collection</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --hot-pink: #ff85a1;
            --soft-pink: #f8c6d1;
            --retro-blue: #7a7dbd;
            --win-border: #222;
            --msn-blue: #3a76f0;
            --msn-light-blue: #dce7ff;
            --ipod-gray: #e0e0e0;
            --bratty-pink: #ff85a1;
            --y2k-silver: #c0c0c0;
            --pixel-font: "Pixelify Sans", "Zpix", "Courier New", monospace;
        }

        /* --- 全局像素风 --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: var(--pixel-font) !important;
            -webkit-font-smoothing: none; text-rendering: crispEdges;
        }

        body {
            margin: 0; height: 100vh; background: var(--retro-blue);
            background-image: 
                linear-gradient(135deg, rgba(255,133,161,0.4) 0%, transparent 50%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 4px);
            overflow: hidden;
        }

        /* --- 顶部栏 --- */
        .top-bar {
            position: fixed; top: 0; width: 100%; height: 28px;
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--win-border);
            display: flex; align-items: center; padding: 0 15px; font-size: 14px; z-index: 10000;
        }

        /* --- 桌面图标 --- */
        .desktop-icons {
            position: absolute; top: 60px; left: 30px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .icon { display: flex; flex-direction: column; align-items: center; cursor: pointer; width: 70px; text-align: center; }
        .icon img { width: 42px; height: 42px; image-rendering: pixelated; }
        .icon span { font-size: 11px; color: white; margin-top: 6px; font-weight: bold; text-shadow: 1px 1px 2px #000; }

        /* --- 窗口基础样式 (Win98/Y2K) --- */
        .window {
            position: absolute; background: var(--y2k-silver);
            border: 2px solid #fff; border-right-color: #444; border-bottom-color: #444;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
            display: none; flex-direction: column; z-index: 50;
        }
        .window-header {
            padding: 4px 8px; background: linear-gradient(90deg, #000080, #087db2); color: white;
            display: flex; justify-content: space-between; align-items: center; cursor: move; font-size: 12px;
        }
        .win-btn { width: 18px; height: 18px; background: var(--y2k-silver); border: 1px solid #fff; border-right-color: #444; border-bottom-color: #444; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; }

        /* --- 网页宠物专属 --- */
        #pet-display {
            background: #000; border: 3px inset #888; height: 150px; 
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        #pet-image { width: 100px; height: 100px; image-rendering: pixelated; }
        .status-bar { height: 12px; background: #444; border: 2px inset #fff; margin-top: 5px; overflow: hidden; }
        #hunger-bar { height: 100%; background: linear-gradient(90deg, #ff00ff, #00ffff); width: 100%; transition: 0.3s; }
        .action-btn { background: var(--y2k-silver); border: 2px solid; border-color: #fff #808080 #808080 #fff; padding: 4px; cursor: pointer; font-size: 10px; font-weight: bold; }
        .action-btn:active { border-color: #808080 #fff #fff #808080; }

        /* --- 聊天窗口样式 --- */
        .chat-main { display: flex; height: 350px; background: #fff; }
        .sidebar { width: 140px; border-right: 1px dashed var(--bratty-pink); padding: 10px; background: #fff0f5; }
        .chat-content { flex: 1; display: flex; flex-direction: column; }
        #messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; }
        .msg-row { margin-bottom: 8px; }
        .stella-msg .msg-author { color: var(--hot-pink); font-weight: bold; }
        .user-msg .msg-author { color: var(--msn-blue); font-weight: bold; }

        /* --- 相册与视频 --- */
        #photo-feed { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px; overflow-y: auto; height: 400px; }
        .video-container { background: #000; aspect-ratio: 16/9; display: flex; align-items: center; }
        
        /* 动画 */
        @keyframes jump { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .anim-jump { animation: jump 0.4s ease-out; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span style="margin-right: 20px; font-weight: bold;"> Stella OS</span>
        <span style="cursor:pointer" onclick="openWin('about')">About</span>
        <div style="margin-left: auto;" id="clock-display">00:00</div>
    </div>

    <div class="desktop-icons">
        <div class="icon" onclick="openWin('messenger')"><img src="/assets/computer.png"><span>Messages</span></div>
        <div class="icon" onclick="openWin('gallery')"><img src="https://img.icons8.com/color/48/000000/photo-album.png"><span>Photos</span></div>
        <div class="icon" onclick="openWin('cat')"><img src="/assets/cat.png"><span>Stella_Pet</span></div>
        <div class="icon" onclick="openWin('audio')"><img src="/assets/vhs.png"><span>iPod</span></div>
        <div class="icon" onclick="openVideoMenu()"><img src="/assets/video.png"><span>Stella Live</span></div>
    </div>

    <div class="window" id="win-messenger" style="left: 300px; top: 80px; width: 500px;">
        <div class="window-header" onmousedown="dragStart(event, 'win-messenger')">
            <span>💖 Stella's Chat</span>
            <div class="win-btn" onclick="closeWin('win-messenger')">×</div>
        </div>
        <div class="chat-main">
            <aside class="sidebar">
                <img src="/IMG_4064.JPG" style="width:100%; border:2px solid var(--hot-pink);">
                <p style="font-size:10px; margin-top:5px;">Stella: Online</p>
            </aside>
            <div class="chat-content">
                <div id="messages"></div>
                <div style="padding:10px; border-top:1px solid #ccc; display:flex; gap:5px;">
                    <input type="text" id="user-input" style="flex:1; padding:4px;" onkeypress="if(event.keyCode==13) sendMessage()">
                    <button class="action-btn" onclick="sendMessage()">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <div class="window" id="win-cat" style="left: 100px; top: 150px; width: 250px;">
        <div class="window-header" onmousedown="dragStart(event, 'win-cat')">
            <span>Stella_Pet.exe</span>
            <div class="win-btn" onclick="closeWin('win-cat')">×</div>
        </div>
        <div style="padding: 10px;">
            <div id="pet-display">
                <div id="pet-bubble" style="position:absolute; top:5px; background:white; padding:2px 5px; font-size:10px; display:none; border:1px solid #000;">!</div>
                <img id="pet-image" src="/assets/stellanyang-idle.png">
            </div>
            <div class="status-bar"><div id="hunger-bar"></div></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-top:10px;">
                <button class="action-btn" onclick="feedPet()">[ FEED ]</button>
                <button class="action-btn" onclick="playGuitar()">[ JAM ]</button>
            </div>
        </div>
    </div>

    <div class="window" id="win-gallery" style="left: 150px; top: 100px; width: 500px;">
        <div class="window-header" onmousedown="dragStart(event, 'win-gallery')">
            <span>Stel-Gram Explorer</span>
            <div class="win-btn" onclick="closeWin('win-gallery')">×</div>
        </div>
        <div style="padding:5px; background:#eee; display:flex; gap:10px;">
            <button class="action-btn" onclick="openWin('upload')">UPLOAD</button>
            <button class="action-btn" onclick="fetchAndRenderPhotos()">REFRESH</button>
        </div>
        <div id="photo-feed"></div>
    </div>

    <div class="window" id="win-video" style="left: 400px; top: 200px; width: 350px;">
        <div class="window-header" onmousedown="dragStart(event, 'win-video')">
            <span>Stella_Live.exe</span>
            <div class="win-btn" onclick="closeWin('win-video')">×</div>
        </div>
        <div style="padding:10px;">
            <div class="video-container"><video id="stella-video" controls style="width:100%;"></video></div>
            <p id="video-status" style="font-size:10px; margin-top:5px;">Ready</p>
        </div>
    </div>

    <div class="window" id="win-audio" style="left: 50px; top: 350px; width: 220px; border-radius:15px; overflow:hidden;">
        <div class="window-header" onmousedown="dragStart(event, 'win-audio')">
            <span>iPod</span>
            <div class="win-btn" onclick="closeWin('win-audio')">×</div>
        </div>
        <div style="background:#9aad9a; height:60px; margin:10px; border:2px inset #fff; padding:5px; font-size:10px;">
            <b>Recorder</b><br>stella_voice.wav
        </div>
        <div style="padding:10px;"><audio controls style="width:100%; height:30px;"><source src="/assets/sample.wav"></audio></div>
    </div>

    <script>
        const supabaseUrl = 'https://gzhsvctnisnoimiddoia.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd6aHN2Y3RuaXNub2ltaWRkb2lhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMxODk4NzcsImV4cCI6MjA4ODc2NTg3N30.tgYKAX_lbjsQ0snGFWLMc6pTUtgmv-D9EywWAOxmbqQ';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 窗口通用逻辑
        function openWin(id) { document.getElementById('win-' + id).style.display = 'flex'; }
        function closeWin(id) { document.getElementById(id).style.display = 'none'; }
        function dragStart(e, id) {
            const el = document.getElementById(id);
            let p1 = 0, p2 = 0, p3 = e.clientX, p4 = e.clientY;
            document.onmousemove = (ev) => {
                p1 = p3 - ev.clientX; p2 = p4 - ev.clientY;
                p3 = ev.clientX; p4 = ev.clientY;
                el.style.top = (el.offsetTop - p2) + "px"; el.style.left = (el.offsetLeft - p1) + "px";
            };
            document.onmouseup = () => document.onmousemove = null;
        }

        // 宠物逻辑
        let hunger = 100;
        const petImages = { idle: '/assets/stellanyang-idle.png', feeding: '/assets/stellanyang-feeding.png', playingGuitar: '/assets/stellanyang-playing-guitar.png' };
        function updatePetUI() { 
            const bar = document.getElementById('hunger-bar');
            bar.style.width = hunger + '%';
            if(hunger < 30) bar.style.background = 'red';
            else bar.style.background = 'linear-gradient(90deg, #ff00ff, #00ffff)';
        }
        function setPetState(state, dur) {
            const img = document.getElementById('pet-image');
            img.src = petImages[state]; img.classList.add('anim-jump');
            setTimeout(() => { img.src = petImages.idle; img.classList.remove('anim-jump'); }, dur);
        }
        function feedPet() { hunger = Math.min(100, hunger + 20); updatePetUI(); setPetState('feeding', 2000); }
        function playGuitar() { hunger = Math.max(0, hunger - 10); updatePetUI(); setPetState('playingGuitar', 3000); }
        setInterval(() => { if(hunger > 0) { hunger -= 1; updatePetUI(); } }, 5000);

        // 聊天逻辑
        function sendMessage() {
            const input = document.getElementById('user-input');
            const msg = input.value; if(!msg) return;
            const container = document.getElementById('messages');
            container.innerHTML += `<div class="msg-row user-msg"><span class="msg-author">Me:</span> ${msg}</div>`;
            input.value = '';
            setTimeout(() => {
                container.innerHTML += `<div class="msg-row stella-msg"><span class="msg-author">Stella:</span> 这里的风景真不错！✨</div>`;
                container.scrollTop = container.scrollHeight;
            }, 1000);
        }

        // 相册逻辑
        async function fetchAndRenderPhotos() {
            const { data } = await _supabase.storage.from('stellla').list();
            const feed = document.getElementById('photo-feed');
            feed.innerHTML = '';
            data.forEach(file => {
                const { data: { publicUrl } } = _supabase.storage.from('stellla').getPublicUrl(file.name);
                feed.innerHTML += `<div style="width:100px; border:1px solid #000; background:#fff; padding:2px;"><img src="${publicUrl}" style="width:100%; height:80px; object-fit:cover; image-rendering:pixelated;"></div>`;
            });
        }

        // 视频逻辑
        function openVideoMenu() {
            const url = 'https://gzhsvctnisnoimiddoia.supabase.co/storage/v1/object/public/stella/32142002782-1-192.mp4';
            const vid = document.getElementById('stella-video');
            vid.src = url; openWin('video'); vid.play();
        }

        // 时钟
        setInterval(() => { document.getElementById('clock-display').innerText = new Date().toLocaleTimeString(); }, 1000);

        window.onload = () => { updatePetUI(); fetchAndRenderPhotos(); };
    </script>
</body>
</html>
