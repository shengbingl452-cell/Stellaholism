<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella OS - Dahyun's Desktop</title>
    <link href="https://fonts.googleapis.com/css2?family=Zpix&display=swap" rel="stylesheet">
    <style>
        :root {
            --win-pink: #FFB7C5;
            --win-hotpink: #FF007F;
            --win-gray: #c0c0c0;
            --win-shadow: #808080;
            --win-highlight: #ffffff;
            --win-blue: #000080;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            -webkit-font-smoothing: none;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: var(--win-pink);
            background-image: 
                radial-gradient(var(--win-hotpink) 1px, transparent 1px),
                linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.1) 75%, transparent 75%, transparent);
            background-size: 10px 10px, 100px 100px;
        }

        /* --- 桌面图标 --- */
        .desktop {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, 80px);
            grid-auto-rows: 90px;
            gap: 20px;
            height: calc(100% - 40px);
        }

        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            text-shadow: 1px 1px #000;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
        }

        .icon img {
            width: 40px;
            height: 40px;
            margin-bottom: 5px;
            image-rendering: pixelated;
        }

        .icon:active span {
            background-color: var(--win-blue);
        }

        /* --- 可拖拽窗口 (Windows 98 风格) --- */
        .window {
            position: absolute;
            top: 100px;
            left: 250px;
            width: 450px;
            background: var(--win-gray);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-shadow) var(--win-shadow) var(--win-highlight);
            padding: 2px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        .window-header {
            background: linear-gradient(90deg, var(--win-hotpink), #ff69b4);
            color: white;
            padding: 3px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 13px;
            cursor: move;
        }

        .window-controls button {
            width: 16px;
            height: 14px;
            font-size: 9px;
            padding: 0;
            background: var(--win-gray);
            border: 1px solid;
            border-color: var(--win-highlight) var(--win-shadow) var(--win-shadow) var(--win-highlight);
            cursor: pointer;
        }

        .window-content {
            background: white;
            border: 2px inset var(--win-gray);
            margin: 2px;
            height: 350px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- 聊天区域 --- */
        #chat-log {
            flex: 1;
            overflow-y: scroll;
            padding: 10px;
            font-size: 12px;
            background: #fff;
        }

        .chat-input-area {
            display: flex;
            padding: 5px;
            gap: 5px;
            border-top: 2px groove var(--win-gray);
        }

        input {
            flex: 1;
            border: 2px inset #eee;
            padding: 3px;
            outline: none;
        }

        button.win-btn {
            background: var(--win-gray);
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-shadow) var(--win-shadow) var(--win-highlight);
            padding: 2px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        button.win-btn:active {
            border-color: var(--win-shadow) var(--win-highlight) var(--win-highlight) var(--win-shadow);
        }

        /* --- 底部任务栏 --- */
        .taskbar {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 35px;
            background: var(--win-gray);
            border-top: 2px solid var(--win-highlight);
            display: flex;
            align-items: center;
            padding: 2px;
            z-index: 1000;
        }

        .start-btn {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            height: 28px;
            border: 2px solid;
            border-color: var(--win-highlight) var(--win-shadow) var(--win-shadow) var(--win-highlight);
            padding: 0 10px;
            cursor: pointer;
        }

        .tray {
            margin-left: auto;
            border: 2px inset var(--win-gray);
            padding: 2px 10px;
            font-size: 12px;
        }

        /* --- 弹窗与视频样式 --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
        }

        .video-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            background: white;
            border: 3px solid var(--win-hotpink);
            padding: 20px;
            z-index: 2001;
            text-align: center;
            box-shadow: 10px 10px 0px rgba(255, 0, 127, 0.2);
        }

        .video-option {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #ffe1ea;
            border: 2px solid var(--win-hotpink);
            font-weight: bold;
            cursor: pointer;
        }

        .video-option:hover {
            background: var(--win-hotpink);
            color: white;
        }

        #video-player-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 3000;
            justify-content: center;
            align-items: center;
        }

        .player-window {
            width: 90%;
            max-width: 700px;
            background: var(--win-gray);
            border: 3px solid var(--win-blue);
            position: relative;
        }

        #stella-video {
            width: 100%;
            display: block;
        }

        #like-btn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: var(--win-hotpink);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .heart-pop {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            animation: heartFly 1s forwards;
        }

        @keyframes heartFly {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-200px); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="desktop">
        <div class="icon" onclick="toggleWindow('chat-window')">
            <img src="/IMG_4064.JPG" alt="Stella">
            <span>Stella Chat</span>
        </div>
        <div class="icon" onclick="window.open('https://c6.y.qq.com/base/fcgi-bin/u?__=nYR9s9FaDfEq')">
            <img src="https://img.icons8.com/color/48/itunes.png" alt="Music">
            <span>My Music</span>
        </div>
        <div class="icon" onclick="openGuitarMenu()">
            <img src="https://img.icons8.com/color/48/electric-guitar.png" alt="Guitar">
            <span>Stella Live</span>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay" onclick="closeGuitarMenu()"></div>
    <div class="video-modal" id="guitar-menu">
        <h3 style="color: var(--win-hotpink); margin: 0 0 10px;">🎸 Stella Live</h3>
        <button class="video-option" onclick="playVideo('https://gzhsvctnisnoimiddoia.supabase.co/storage/v1/object/public/stella/32142002782-1-192.mp4', 'Sparks')">✨ Sparks</button>
        <button class="video-option" onclick="playVideo('https://gzhsvctnisnoimiddoia.supabase.co/storage/v1/object/public/stella/25874732599-1-192.mp4', 'My Love Mine All Mine')">🌙 My Love Mine All Mine</button>
        <div style="margin-top: 10px; font-size: 12px; cursor: pointer;" onclick="closeGuitarMenu()">[ 取消 ]</div>
    </div>

    <div id="video-player-container" onclick="stopVideo()">
        <div class="player-window" onclick="event.stopPropagation()">
            <div class="window-header" style="cursor: default;">
                <span id="video-title">Stella Player</span>
                <div class="window-controls">
                    <button onclick="stopVideo()">X</button>
                </div>
            </div>
            <video id="stella-video" controls></video>
            <button id="like-btn" onclick="burstHearts()">💖 给 Stella 点赞</button>
        </div>
    </div>

    <div class="window" id="chat-window">
        <div class="window-header" id="chat-header">
            <span>💬 Stella Messenger</span>
            <div class="window-controls">
                <button>_</button>
                <button>□</button>
                <button onclick="toggleWindow('chat-window')" style="background: #e6e6e6;">X</button>
            </div>
        </div>
        <div class="window-content">
            <div id="chat-log">
                <div style="color: blue;">*** Stella has joined the chat ***</div>
                <div style="margin-top:5px;"><b>Stella:</b> Hii! 欢迎来到我的 2000s 桌面~ 💖 尝试拖动一下这个窗口？</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Type a message..." onkeypress="if(event.keyCode==13) sendMsg()">
                <button class="win-btn" onclick="sendMsg()">Send</button>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div class="start-btn">
            <img src="https://img.icons8.com/color/20/windows-95.png" alt="Start">
            <span>Start</span>
        </div>
        <div style="margin-left: 10px; border-left: 1px solid var(--win-shadow); height: 20px;"></div>
        <div class="tray" id="clock">12:00 PM</div>
    </div>

    <script>
        // 1. 窗口拖拽逻辑
        dragElement(document.getElementById("chat-window"));

        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const header = document.getElementById("chat-header");
            if (header) {
                header.onmousedown = dragMouseDown;
            }

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                elmnt.style.zIndex = 100;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        // 2. 聊天逻辑 (对接你的 API)
        async function sendMsg() {
            const input = document.getElementById('user-input');
            const log = document.getElementById('chat-log');
            const text = input.value.trim();
            if(!text) return;

            log.innerHTML += `<div><b>Me:</b> ${text}</div>`;
            input.value = '';

            try {
                const response = await fetch('/api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                log.innerHTML += `<div style="color:var(--win-hotpink)"><b>Stella:</b> ${data.reply}</div>`;
                log.scrollTop = log.scrollHeight;
            } catch (e) {
                log.innerHTML += `<div style="color:gray"><i>Connection lost...</i></div>`;
            }
        }

        // 3. 其他小功能
        function toggleWindow(id) {
            const win = document.getElementById(id);
            win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 4. 视频弹窗与播放
        function openGuitarMenu() {
            document.getElementById('guitar-menu').style.display = 'block';
            document.getElementById('modal-overlay').style.display = 'block';
        }

        function closeGuitarMenu() {
            document.getElementById('guitar-menu').style.display = 'none';
            document.getElementById('modal-overlay').style.display = 'none';
        }

        function playVideo(url, title) {
            const video = document.getElementById('stella-video');
            document.getElementById('video-title').innerText = "Now Playing: " + title;
            video.src = url;
            closeGuitarMenu();
            document.getElementById('video-player-container').style.display = 'flex';
            video.play();
        }

        function stopVideo() {
            const video = document.getElementById('stella-video');
            video.pause();
            document.getElementById('video-player-container').style.display = 'none';
        }

        function burstHearts() {
            for (let i = 0; i < 10; i++) {
                const h = document.createElement('div');
                h.className = 'heart-pop';
                h.innerText = '💖';
                h.style.left = (window.innerWidth / 2 + (Math.random() * 200 - 100)) + 'px';
                h.style.top = (window.innerHeight / 2 + 100) + 'px';
                h.style.fontSize = '24px';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 1000);
            }
        }
    </script>
</body>
</html>
