<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dahyun’s Glitzy World | Stella's Pink Room</title>
    <style>
        :root {
            --bratty-pink: #FF007F;
            --cloudy-pink: #FFF0F5;
            --y2k-silver: #E5E4E2;
            --matcha-green: #B7D9A4;
            --msn-blue: #0050e6;
            --text-dark: #333;
        }

        /* 基础样式与流体背景 */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(-45deg, #FFF0F5, #FFE4E1, #FFB7C5, #FFF0F5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'MS Sans Serif', 'Tahoma', sans-serif;
            overflow-x: hidden;
            transition: filter 0.3s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body.myopia-mode { filter: blur(4px); }

        /* --- 导航栏 --- */
        nav {
            position: fixed;
            left: 25px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1000;
        }

        .nav-item {
            width: 55px;
            height: 55px;
            background: white;
            border: 3px solid var(--bratty-pink);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            text-decoration: none;
            box-shadow: 5px 5px 0px var(--bratty-pink);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .nav-item:hover {
            transform: scale(1.1) translate(5px, -5px);
            background: var(--bratty-pink);
            color: white;
        }

        /* --- MSN 聊天窗口 --- */
        .msn-window {
            max-width: 900px;
            height: 85vh;
            margin: 40px auto;
            background: #f1f1f1;
            border: 2px solid var(--msn-blue);
            border-radius: 8px 8px 0 0;
            display: flex;
            flex-direction: column;
            box-shadow: 15px 15px 0px rgba(0, 0, 0, 0.1);
        }

        .msn-header {
            background: linear-gradient(to bottom, #76a9ff 0%, var(--msn-blue) 100%);
            padding: 8px 15px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }

        .msn-body { display: flex; flex: 1; overflow: hidden; background: white; }

        .msn-sidebar {
            width: 200px;
            background: #d6e4ff;
            padding: 20px;
            border-right: 1px solid #999;
            text-align: center;
        }

        .msn-avatar {
            width: 100px;
            height: 100px;
            border: 4px solid white;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            margin-bottom: 10px;
            object-fit: cover;
        }

        .msn-chat-area { flex: 1; display: flex; flex-direction: column; }

        #chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-image: linear-gradient(rgba(255,192,203,0.1) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(255,192,203,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .message { margin-bottom: 15px; max-width: 85%; padding: 10px; border-radius: 10px; font-size: 14px; }
        .stella-msg { background: #f0f0f0; border: 1px solid #ccc; align-self: flex-start; }
        .user-msg { background: #e1f5fe; border: 1px solid #b3e5fc; align-self: flex-end; margin-left: auto; }

        .msn-input-zone { padding: 15px; border-top: 1px solid #ccc; display: flex; gap: 10px; }
        #user-input { flex: 1; padding: 10px; border: 1px solid #999; outline: none; }

        /* --- 弹窗与视频样式 --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
        }

        .video-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            background: white;
            border: 3px solid var(--bratty-pink);
            padding: 20px;
            z-index: 2001;
            text-align: center;
            box-shadow: 10px 10px 0px rgba(255, 0, 127, 0.2);
        }

        .video-option {
            display: block; width: 100%; padding: 12px; margin: 10px 0;
            background: var(--cloudy-pink);
            border: 2px solid var(--bratty-pink);
            font-weight: bold; cursor: pointer;
        }

        .video-option:hover { background: var(--bratty-pink); color: white; }

        #video-player-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 3000;
            justify-content: center; align-items: center;
        }

        .player-window {
            width: 90%; max-width: 700px;
            background: var(--y2k-silver);
            border: 3px solid var(--msn-blue);
            position: relative;
        }

        video { width: 100%; display: block; }

        #like-btn {
            position: absolute; bottom: 60px; right: 20px;
            background: var(--bratty-pink); color: white;
            border: none; padding: 10px 15px; border-radius: 20px;
            cursor: pointer; font-weight: bold; z-index: 3001;
        }

        .falling-emoji, .heart-pop {
            position: fixed; pointer-events: none; z-index: 9999;
            animation: fall linear forwards;
        }

        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
        @keyframes heartFly { 
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-200px) opacity: 0; }
        }
    </style>
</head>
<body>

    <div style="position:fixed; top:20px; right:20px; z-index:1000;">
        <button onclick="toggleVision()" style="background:white; border:2px solid #333; padding:8px; border-radius:50%; cursor:pointer;">👓</button>
    </div>

    <nav>
        <div class="nav-item" onclick="openGuitarMenu()">🎸</div>
        <div class="nav-item" onclick="dropEmojis('❄️')">❄️</div>
        <a href="https://c6.y.qq.com/base/fcgi-bin/u?__=nYR9s9FaDfEq" class="nav-item" target="_blank" rel="noopener">🎧</a>
    </nav>

    <div class="msn-window">
        <div class="msn-header">
            <span>(Online) Stella - Dahyun's Pink Room</span>
            <span>[X]</span>
        </div>
        <div class="msn-body">
            <aside class="msn-sidebar">
                <img src="/IMG_4064.JPG" alt="Stella" class="msn-avatar">
                <p style="font-weight:bold; color:var(--msn-blue);">Stella</p>
                <p style="font-size:11px; color:#666;">"Playing Guitar... 🎸"</p>
            </aside>
            <main class="msn-chat-area">
                <div id="chat-history">
                    <div class="message stella-msg"><b>Stella:</b><br>Hii! 想听我弹吉他吗？点击左边的 🎸 按钮哦！或者跟我聊聊天~ 💖</div>
                </div>
                <div class="msn-input-zone">
                    <input type="text" id="user-input" placeholder="说点什么..." onkeypress="if(event.keyCode==13) handleSend()">
                    <button id="send-btn" onclick="handleSend()" style="padding:5px 15px; cursor:pointer;">发送</button>
                </div>
            </main>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay" onclick="closeGuitarMenu()"></div>
    <div class="video-modal" id="guitar-menu">
        <h3 style="color:var(--bratty-pink);">🎸 Stella Live</h3>
        <button class="video-option" onclick="playVideo('https://gzhsvctnisnoimiddoia.supabase.co/storage/v1/object/public/stella/32142002782-1-192.mp4', 'Sparks')">✨ Sparks</button>
        <button class="video-option" onclick="playVideo('https://gzhsvctnisnoimiddoia.supabase.co/storage/v1/object/public/stella/25874732599-1-192.mp4', 'My Love Mine All Mine')">🌙 My Love Mine All Mine</button>
        <p onclick="closeGuitarMenu()" style="font-size:12px; cursor:pointer; margin-top:10px;">[ 取消 ]</p>
    </div>

    <div id="video-player-container" onclick="stopVideo()">
        <div class="player-window" onclick="event.stopPropagation()">
            <div class="msn-header">
                <span id="video-title">Stella Player</span>
                <span onclick="stopVideo()" style="cursor:pointer;">[关闭]</span>
            </div>
            <video id="stella-video" controls></video>
            <button id="like-btn" onclick="burstHearts()">💖 给 Stella 点赞</button>
        </div>
    </div>

    <script>
        // 1. 聊天逻辑 (DeepSeek API)
        async function handleSend() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('Me', text, 'user-msg');
            input.value = '';
            checkEasterEggs(text.toLowerCase());

            // 调用后端 API (Render部署后的地址)
            showTyping(true);
            try {
                const response = await fetch('/api/chat', { 
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                showTyping(false);
                appendMessage('Stella', data.reply, 'stella-msg');
            } catch (e) {
                showTyping(false);
                appendMessage('System', '魔法连接中断... 📡', 'stella-msg');
            }
        }

        // 2. 视频控制 (Supabase)
        function playVideo(url, title) {
            const video = document.getElementById('stella-video');
            document.getElementById('video-title').innerText = "Now Playing: " + title;
            video.src = url;
            closeGuitarMenu();
            document.getElementById('video-player-container').style.display = 'flex';
            video.play();
        }

        function stopVideo() {
            const video = document.getElementById('stella-video');
            video.pause();
            document.getElementById('video-player-container').style.display = 'none';
        }

        // 3. 特效与交互
        function burstHearts() {
            for(let i=0; i<10; i++) {
                const h = document.createElement('div');
                h.innerText = '💖';
                h.style.position = 'fixed';
                h.style.left = (window.innerWidth/2 + (Math.random()*200-100)) + 'px';
                h.style.top = (window.innerHeight/2 + 100) + 'px';
                h.style.fontSize = '24px';
                h.style.animation = 'heartFly 1s forwards';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 1000);
            }
        }

        function dropEmojis(emoji) {
            for (let i = 0; i < 15; i++) {
                const el = document.createElement('div');
                el.className = 'falling-emoji';
                el.innerText = emoji;
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 4000);
            }
        }

        function appendMessage(sender, text, className) {
            const history = document.getElementById('chat-history');
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerHTML = `<b>${sender}:</b><br>${text}`;
            history.appendChild(div);
            history.scrollTop = history.scrollHeight;
        }

        function showTyping(show) {
            const id = 'typing-indicator';
            if (show) {
                const div = document.createElement('div');
                div.id = id; div.className = 'message stella-msg';
                div.innerText = 'Stella 正在输入... ✨';
                document.getElementById('chat-history').appendChild(div);
            } else {
                const el = document.getElementById(id); if(el) el.remove();
            }
        }

        function checkEasterEggs(t) {
            if(t.includes('cupcake')) dropEmojis('🧁');
            if(t.includes('star')) dropEmojis('✨');
        }

        function openGuitarMenu() { 
            document.getElementById('guitar-menu').style.display = 'block'; 
            document.getElementById('modal-overlay').style.display = 'block'; 
        }
        function closeGuitarMenu() { 
            document.getElementById('guitar-menu').style.display = 'none'; 
            document.getElementById('modal-overlay').style.display = 'none'; 
        }
        function toggleVision() { document.body.classList.toggle('myopia-mode'); }
    </script>
</body>
</html>
