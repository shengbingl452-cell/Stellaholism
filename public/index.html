<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stella OS - Dahyun's Desktop</title>
    <style>
        :root {
            --win-pink: #FFB7C5;
            --win-hotpink: #FF007F;
            --win-gray: #c2c2c2;
            --win-shadow: #808080;
            --win-highlight: #ffffff;
            --win-blue: #000080;
        }

        * { box-sizing: border-box; font-family: 'Tahoma', 'Arial', sans-serif; -webkit-font-smoothing: none; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: var(--win-pink); }

        .desktop-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(var(--win-hotpink) 1px, transparent 1px);
            background-size: 15px 15px; z-index: -1;
        }

        /* --- 顶部任务栏 --- */
        .taskbar {
            position: fixed; top: 0; width: 100%; height: 30px;
            background: var(--win-gray); border-bottom: 2px solid var(--win-shadow);
            display: flex; align-items: center; padding: 2px; z-index: 9999;
        }
        .start-btn {
            font-weight: bold; display: flex; align-items: center; gap: 5px; height: 24px;
            border: 2px solid; border-color: var(--win-highlight) var(--win-shadow) var(--win-shadow) var(--win-highlight);
            padding: 0 8px; cursor: pointer; font-size: 12px;
        }
        .start-btn:active { border-color: var(--win-shadow) var(--win-highlight) var(--win-highlight) var(--win-shadow); }

        /* --- 桌面布局 --- */
        .desktop { padding: 50px 20px 20px 20px; display: flex; flex-direction: column; gap: 20px; height: 100%; }
        .icon { width: 70px; display: flex; flex-direction: column; align-items: center; cursor: pointer; text-align: center; }
        .icon img { width: 32px; height: 32px; image-rendering: pixelated; margin-bottom: 5px; }
        .icon span { color: white; font-size: 11px; text-shadow: 1px 1px #000; padding: 2px; }

        /* --- 通用窗口样式 --- */
        .window {
            position: absolute; background: var(--win-gray); border: 2px solid;
            border-color: var(--win-highlight) var(--win-shadow) var(--win-shadow) var(--win-highlight);
            padding: 2px; display: none; flex-direction: column; min-width: 200px;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.2);
        }
        .window-header {
            background: linear-gradient(90deg, var(--win-hotpink), #ff69b4);
            color: white; padding: 3px 6px; display: flex; justify-content: space-between;
            align-items: center; font-weight: bold; font-size: 12px; cursor: move;
        }
        .window-controls button {
            width: 16px; height: 14px; font-size: 9px; background: var(--win-gray);
            border: 1px solid; border-color: var(--win-highlight) var(--win-shadow) var(--win-shadow) var(--win-highlight);
            cursor: pointer;
        }
        .window-content { background: white; border: 2px inset var(--win-gray); margin: 2px; padding: 10px; }

        /* --- 各窗口特有样式 --- */
        #chat-window { width: 360px; left: 300px; top: 60px; }
        #about-window { width: 320px; left: 420px; top: 220px; }

        #chat-log { height: 200px; overflow-y: auto; font-size: 12px; border: 1px inset; margin-bottom: 5px; padding: 5px; }

        /* --- 视频弹窗与播放器 --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 2000;
        }
        .video-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 320px; background: white; border: 3px solid var(--win-hotpink);
            padding: 20px; z-index: 2001; text-align: center;
            box-shadow: 10px 10px 0px rgba(255, 0, 127, 0.2);
        }
        .video-option {
            display: block; width: 100%; padding: 10px; margin: 8px 0;
            background: #ffe1ea; border: 2px solid var(--win-hotpink);
            font-weight: bold; cursor: pointer;
        }
        .video-option:hover { background: var(--win-hotpink); color: white; }

        #video-player-container {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center;
        }
        .player-window {
            width: 90%; max-width: 700px; background: var(--win-gray);
            border: 3px solid var(--win-blue); position: relative;
        }
        #stella-video { width: 100%; display: block; }
        #like-btn {
            position: absolute; bottom: 10px; right: 10px; background: var(--win-hotpink);
            color: white; border: none; padding: 6px 12px; border-radius: 16px; cursor: pointer;
            font-weight: bold;
        }
        .heart-pop {
            position: fixed; pointer-events: none; z-index: 9999; animation: heartFly 1s forwards;
        }
        @keyframes heartFly {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-200px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="desktop-bg"></div>

    <div class="taskbar">
        <div class="start-btn" onclick="alert('Stella OS v1.0 - 系统运行良好')">
            <img src="https://img.icons8.com/color/16/windows-95.png" alt="Start">
            <span>Start</span>
        </div>
        <div style="margin-left:auto; font-size: 12px; padding-right: 10px;" id="clock">12:00 PM</div>
    </div>

    <div class="desktop">
        <div class="icon" onclick="openWindow('chat-window')">
            <img src="/IMG_4064.JPG" alt="Stella">
            <span>Messenger</span>
        </div>
        <div class="icon" onclick="window.open('https://c6.y.qq.com/base/fcgi-bin/u?__=nYR9s9FaDfEq')">
            <img src="https://img.icons8.com/color/48/itunes.png" alt="Music">
            <span>My Music</span>
        </div>
        <div class="icon" onclick="openGuitarMenu()">
            <img src="/assets/video.png" alt="Video">
            <span>Stella Live</span>
        </div>
        <div class="icon" onclick="openWindow('about-window')">
            <img src="https://img.icons8.com/color/48/info.png" alt="About">
            <span>About</span>
        </div>
    </div>

    <div class="window" id="chat-window">
        <div class="window-header">
            <span>Stella Chat</span>
            <div class="window-controls"><button onclick="closeWindow('chat-window')">X</button></div>
        </div>
        <div class="window-content">
            <div id="chat-log"><b>Stella:</b> 嘿！欢迎回到 Stella OS~ 💖</div>
            <div style="display:flex; gap:5px; margin-top: 6px;">
                <input type="text" id="chat-input" style="flex:1" onkeypress="if(event.keyCode==13) sendMsg()">
                <button onclick="sendMsg()">Send</button>
            </div>
        </div>
    </div>

    <div class="window" id="about-window">
        <div class="window-header">
            <span>About This Site</span>
            <div class="window-controls"><button onclick="closeWindow('about-window')">X</button></div>
        </div>
        <div class="window-content">
            <p><b>Author:</b> Stella</p>
            <p><b>Description:</b><br>这是一个基于 Y2K 风格打造的 Stella 个人主页，致敬 2000 年代的数字美学。</p>
            <hr>
            <p><b>Special Thanks:</b></p>
            <ul>
                <li>Dahyun (Stella) - 灵感来源</li>
                <li>DeepSeek - AI 后端支持</li>
            </ul>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay" onclick="closeGuitarMenu()"></div>
    <div class="video-modal" id="guitar-menu">
        <h3 style="color: var(--win-hotpink); margin: 0 0 10px;">🎸 Stella Live</h3>
        <button class="video-option" onclick="playVideo('https://gzhsvctnisnoimiddoia.supabase.co/storage/v1/object/public/stella/32142002782-1-192.mp4', 'Sparks')">✨ Sparks</button>
        <button class="video-option" onclick="playVideo('https://gzhsvctnisnoimiddoia.supabase.co/storage/v1/object/public/stella/25874732599-1-192.mp4', 'My Love Mine All Mine')">🌙 My Love Mine All Mine</button>
        <div style="margin-top: 10px; font-size: 12px; cursor: pointer;" onclick="closeGuitarMenu()">[ 取消 ]</div>
    </div>

    <div id="video-player-container" onclick="stopVideo()">
        <div class="player-window" onclick="event.stopPropagation()">
            <div class="window-header" style="cursor: default;">
                <span id="video-title">Stella Player</span>
                <div class="window-controls">
                    <button onclick="stopVideo()">X</button>
                </div>
            </div>
            <video id="stella-video" controls></video>
            <button id="like-btn" onclick="burstHearts()">💖 给 Stella 点赞</button>
        </div>
    </div>

    <script>
        let highestZ = 100;

        function initWindow(id) {
            const win = document.getElementById(id);
            const header = win.querySelector('.window-header');

            win.onmousedown = () => {
                highestZ++;
                win.style.zIndex = highestZ;
            };

            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            header.onmousedown = (e) => {
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = () => {
                    document.onmouseup = null;
                    document.onmousemove = null;
                };
                document.onmousemove = (e) => {
                    e = e || window.event;
                    e.preventDefault();
                    pos1 = pos3 - e.clientX;
                    pos2 = pos4 - e.clientY;
                    pos3 = e.clientX;
                    pos4 = e.clientY;
                    win.style.top = (win.offsetTop - pos2) + "px";
                    win.style.left = (win.offsetLeft - pos1) + "px";
                };
            };
        }

        ['chat-window', 'about-window'].forEach(initWindow);

        function openWindow(id) {
            const win = document.getElementById(id);
            win.style.display = 'flex';
            highestZ++;
            win.style.zIndex = highestZ;
        }

        function closeWindow(id) { document.getElementById(id).style.display = 'none'; }

        async function sendMsg() {
            const input = document.getElementById('chat-input');
            const log = document.getElementById('chat-log');
            const text = input.value.trim();
            if (!text) return;
            log.innerHTML += `<div><b>Me:</b> ${text}</div>`;
            input.value = '';

            try {
                const response = await fetch('/api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                log.innerHTML += `<div style="color:var(--win-hotpink)"><b>Stella:</b> ${data.reply}</div>`;
                log.scrollTop = log.scrollHeight;
            } catch (e) {
                log.innerHTML += `<div style="color:gray"><i>Connection lost...</i></div>`;
            }
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }
        setInterval(updateClock, 1000); updateClock();

        // 视频弹窗与播放
        function openGuitarMenu() {
            document.getElementById('guitar-menu').style.display = 'block';
            document.getElementById('modal-overlay').style.display = 'block';
        }
        function closeGuitarMenu() {
            document.getElementById('guitar-menu').style.display = 'none';
            document.getElementById('modal-overlay').style.display = 'none';
        }
        function playVideo(url, title) {
            const video = document.getElementById('stella-video');
            document.getElementById('video-title').innerText = "Now Playing: " + title;
            video.src = url;
            closeGuitarMenu();
            document.getElementById('video-player-container').style.display = 'flex';
            video.play();
        }
        function stopVideo() {
            const video = document.getElementById('stella-video');
            video.pause();
            document.getElementById('video-player-container').style.display = 'none';
        }
        function burstHearts() {
            for (let i = 0; i < 10; i++) {
                const h = document.createElement('div');
                h.className = 'heart-pop';
                h.innerText = '💖';
                h.style.left = (window.innerWidth / 2 + (Math.random() * 200 - 100)) + 'px';
                h.style.top = (window.innerHeight / 2 + 100) + 'px';
                h.style.fontSize = '24px';
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 1000);
            }
        }
    </script>
</body>
</html>
